[project]
name = "html2md"
version = "0.0.1"
description = "Fast streaming HTML to Markdown conversion built on lxml (releases the GIL)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
benchmark = [
    "beautifulsoup4>=4.12",
    "htmd-py>=0.1.2",
    "html-to-markdown==3.5.7",
    "html2text-rs>=0.2.5",
    "markdownify>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/html2md"]
