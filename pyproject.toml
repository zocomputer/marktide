[project]
name = "html2md"
version = "0.0.1"
description = "Fast streaming HTML to Markdown conversion built on lxml (releases the GIL)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/html2md"]
