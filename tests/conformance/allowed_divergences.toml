[[divergence]]
source = "commonmark_expected_html"
case_id = "commonmark:0630"
diff_summary = "lxml treats a CDATA section containing '>' as malformed comment text and does not expose the original CDATA content in parser events"
reason = "Intentional parser divergence: the CommonMark HTML fixture contains CDATA text with angle brackets (`foo <![CDATA[>&<]]>`). lxml/libxml2 recovers it as malformed comment data (`&<]]>`) rather than surfacing the original `>&<` text, so html2md cannot reconstruct markdownify/BeautifulSoup's output from the event stream. Plain CDATA without this malformed angle-bracket recovery path is preserved."
owner = "coder-1-leaf"
revisit = "only if the parser layer gains a pre-scan/rewrite for malformed CDATA sections before lxml feed; otherwise this remains unrecoverable from lxml events"
